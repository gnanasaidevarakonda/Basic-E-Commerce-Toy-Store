services:
  # ==========================================
  # Service 1: Web Server (Nginx)
  # ==========================================
  web:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME:-toystore}_web
    restart: unless-stopped
    ports:
      - "${HOST_WEB_PORT:-8085}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - app

  # ==========================================
  # Service 2: PHP Application (PHP 8.2-FPM)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-toystore}_app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8085}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-toystore_db}
      DB_USERNAME: ${DB_USERNAME:-toystore_user}
      DB_PASSWORD: ${DB_PASSWORD:-toystore_password}
      JWT_SECRET: ${JWT_SECRET:-toystore_super_secret_jwt_key!}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
    volumes:
      - ./:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      - db

  # ==========================================
  # Service 3: MySQL Database (MySQL 8.0)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: ${COMPOSE_PROJECT_NAME:-toystore}_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-toystore_db}
      MYSQL_USER: ${DB_USERNAME:-toystore_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-toystore_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

volumes:
  db_data:
    driver: local
