services:
  # ==========================================
  # Service 1: Web Server (Nginx)
  # ==========================================
  web:
    image: nginx:alpine
    container_name: ${WEB_CONTAINER_NAME:-toystore_web}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8085}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # ==========================================
  # Service 2: PHP Application (PHP 8.2-FPM)
  # ==========================================
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: ${APP_CONTAINER_NAME:-toystore_app}
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      - db

  # ==========================================
  # Service 3: MySQL Database (MySQL 8.0)
  # ==========================================
  db:
    image: mysql:8.0
    container_name: ${DB_CONTAINER_NAME:-toystore_db}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: toystore_db
      MYSQL_USER: toystore_user
      MYSQL_PASSWORD: toystore_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

volumes:
  db_data:
    driver: local
