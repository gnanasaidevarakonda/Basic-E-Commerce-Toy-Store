server {
    # Listen on port 80 inside the container
    listen 80;
    server_name localhost;

    # Prevent Nginx from stripping external port 8085 on directory redirects
    absolute_redirect off;

    # Notice the space after root
    root /var/www/html/public;
    index index.php index.html;

    # Global CORS headers
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

    # Development mode: Prevent browser from caching CSS/JS files
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

    # Notice the spaces around if
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Notice the space between location and /
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Pass PHP requests to PHP-FPM container on port 9000
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    # Block access to hidden files (.env, .git)
    location ~ /\. {
        deny all;
    }

    # Double-Wall Gateway Shield: Protect Backoffice from Public Scanners
    location /admin {
        auth_basic "ToyStore Restricted Backoffice Gateway";
        auth_basic_user_file /etc/nginx/.htpasswd;

    # Prevent search engine indexing
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

        try_files $uri $uri/ /index.php?$query_string;
    }
}